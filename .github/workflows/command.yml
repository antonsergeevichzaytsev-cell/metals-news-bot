name: Telegram command

# repository_dispatch от Cloudflare Worker (cloudflare-worker/worker.js) —
# тот же паттерн, что fitness_bot.yml: Worker шлёт тело Telegram-апдейта
# в client_payload, bot_commands.py читает его из TELEGRAM_UPDATE_JSON,
# НЕ делает повторный getUpdates (взаимоисключающе с активным webhook,
# см. fitness-bot DEPLOY.md / worker.js для полной истории фикса 28.07.2026).

on:
  repository_dispatch:
    types: [telegram_update]
  workflow_dispatch: {}  # для ручной проверки без реального апдейта

concurrency:
  group: repo-writes
  cancel-in-progress: false
  # Общая группа с digest.yml/evening_digest.yml и остальными воркфлоу
  # этого репо, которые коммитят в main — тот же паттерн защиты очереди,
  # что уже применён везде здесь (см. digest.yml).
  queue: max

permissions:
  contents: write

jobs:
  command:
    runs-on: ubuntu-latest
    # /digest внутри команды может занять почти столько же, сколько сам
    # digest.yml — даём такой же запас.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Handle Telegram command
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_UPDATE_JSON: ${{ toJson(github.event.client_payload.update) }}
        run: python bot_commands.py

      - name: Commit state if changed
        run: |
          git config user.name "metals-bot"
          git config user.email "bot@noreply.local"
          # /digest внутри cmd_digest() может изменить state.json/history.json/
          # state_last_digest_sent.json — коммитим всё, что реально изменилось.
          # 20.08.2026: тот же баг, что нашли в digest.yml — git add с
          # несуществующим файлом среди аргументов падает целиком (exit 128),
          # "2>/dev/null || true" глушил и это, и весь commit молча
          # пропускался с 16.08 (когда state_watchlist.json попал в этот
          # список, но сам файл создаётся только при первом /watch).
          FILES_TO_ADD=""
          for f in state.json history.json state_last_digest_sent.json state_watchlist.json state_usage.json state_feedback.json; do
            [ -f "$f" ] && FILES_TO_ADD="$FILES_TO_ADD $f"
          done
          if [ -z "$FILES_TO_ADD" ]; then
            echo "no tracked state files exist on disk, nothing to add"
            exit 0
          fi
          git add $FILES_TO_ADD
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "command: $(date -u +%Y-%m-%d_%H-%MZ)"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || git rebase --abort
            git push origin HEAD:main && exit 0
            echo "retry $i"; sleep $((RANDOM % 6 + 2))
          done
          echo "push failed after 5 retries"; exit 1
