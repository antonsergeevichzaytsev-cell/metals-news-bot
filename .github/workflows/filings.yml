name: Filings watcher

concurrency:
  group: repo-writes
  cancel-in-progress: false
  # queue: max — без этого GitHub по умолчанию отменяет все PENDING прогоны
  # в группе кроме последнего (даже с cancel-in-progress: false, который
  # защищает только уже ЗАПУЩЕННЫЙ прогон). Найдено 21.07: 4 из 8 ручных
  # dispatch отменились именно так — не гонка пуша, а вытеснение из очереди.
  queue: max

on:
  schedule:
    # UTC. Вайр Newsfile канадский: пик 09:00-18:00 ET = 13:00-22:00 UTC.
    # Ленты отдают по 10 позиций — частим, иначе теряем.
    # Время Ташкента, UTC+5 (переведено с MSK 05.08.2026).
    # Узбекистан летнее время не применяет — сдвиг фиксированный
    # круглый год, сезонной правки cron не потребуется.
    - cron: '30 3 * * 1-5'   # 08:30 Ташкент    # 08:30 MSK — сгребает ночной улов из очереди
    - cron: '0 11 * * 1-5'   # 16:00 Ташкент    # 16:00 MSK
    - cron: '0 14 * * 1-5'   # 19:00 Ташкент    # 19:00 MSK
    - cron: '0 17 * * 1-5'   # 22:00 Ташкент    # 22:00 MSK
    - cron: '0 20 * * 1-5'   # 01:00 след. дня Ташкент    # 01:00 MSK — тихие часы: копит, не шлёт
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  filings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run filings watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          DEEPSEEK_API_KEY:   ${{ secrets.DEEPSEEK_API_KEY }}
        run: python filings.py
      - name: Commit updated state
        run: |
          git config user.name  "metals-bot"
          git config user.email "bot@noreply.local"
          # 20.08.2026: тот же защитный паттерн, что в digest.yml/command.yml —
          # git add с несуществующим файлом среди аргументов падает целиком
          # (exit 128), проглатывается через || true, весь commit молча
          # пропускается. Оба файла здесь сейчас существуют, но паттерн
          # хрупок на будущее при добавлении третьего файла в этот список.
          FILES_TO_ADD=""
          for f in state_filings.json filings_history.json; do
            [ -f "$f" ] && FILES_TO_ADD="$FILES_TO_ADD $f"
          done
          if [ -z "$FILES_TO_ADD" ]; then
            echo "no tracked state files exist on disk, nothing to add"
            exit 0
          fi
          git add $FILES_TO_ADD
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "filings state: $(date -u +%Y-%m-%d_%H-%MZ)"
          for i in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git rebase origin/main || git rebase --abort
            git push origin HEAD:main && exit 0
            echo "retry $i"; sleep $((RANDOM % 10 + 5))
          done
          echo "push failed after 8 retries"; exit 1
