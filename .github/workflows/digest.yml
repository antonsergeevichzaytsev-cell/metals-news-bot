name: Metals & Mining digest

concurrency:
  group: repo-writes
  cancel-in-progress: false
  # queue: max — без этого GitHub по умолчанию отменяет все PENDING прогоны
  # в группе кроме последнего (даже с cancel-in-progress: false, который
  # защищает только уже ЗАПУЩЕННЫЙ прогон). Найдено 21.07: 4 из 8 ручных
  # dispatch отменились именно так — не гонка пуша, а вытеснение из очереди.
  queue: max

on:
  schedule:
    # Время Ташкента, UTC+5 (переведено с MSK 05.08.2026).
    # Узбекистан летнее время не применяет — сдвиг фиксированный
    # круглый год, сезонной правки cron не потребуется.
    - cron: '0 3 * * 1-5'   # 08:00 Ташкент
    - cron: '0 15 * * 1-5'   # 20:00 Ташкент
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          DEEPSEEK_API_KEY:   ${{ secrets.DEEPSEEK_API_KEY }}
        run: python digest.py
      - name: Commit updated state
        run: |
          git config user.name  "metals-bot"
          git config user.email "bot@noreply.local"
          git add state.json history.json state_last_digest_sent.json || true
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "state: $(date -u +%Y-%m-%d_%H-%MZ)"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || git rebase --abort
            git push origin HEAD:main && exit 0
            echo "retry $i"; sleep $((RANDOM % 6 + 2))
          done
          echo "push failed after 5 retries"; exit 1
      - name: Heartbeat ping (Cronitor)
        if: success()
        # Внешний dead-man's-switch, независимый от GitHub Actions самого
        # репозитория — 16.08.2026 обнаружено, что Actions могут быть
        # выключены на уровне репо (Settings→Actions: enabled=false) без
        # видимого сигнала: ни один workflow_run не создаётся, значит
        # alert_on_failure.yml тоже не срабатывает. Cronitor следит за
        # тем же расписанием (0 3,15 * * 1-5) снаружи GitHub и шлёт алерт
        # в Telegram сам, если пинг не пришёл вовремя — не зависит от того,
        # выполняется ли здесь хоть что-то. Пингуем только на success:
        # если digest.py или git push упали, шаг с if: success() не
        # выполнится, пинг не уйдёт, и это тоже правильный сигнал тревоги.
        run: curl -fsS -m 10 --retry 3 "https://cronitor.link/p/2b03b1b6f321411abeba488a443d257d/p34IN8" || true
