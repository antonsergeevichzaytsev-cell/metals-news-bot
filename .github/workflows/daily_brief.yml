name: Anton Daily brief

on:
  schedule:
    # Время Ташкента, UTC+5 (переведено с MSK 05.08.2026).
    # Узбекистан летнее время не применяет — сдвиг фиксированный
    # круглый год, сезонной правки cron не потребуется.
    - cron: '30 3 * * 1-5'   # 08:30 Ташкент  # 08:00 MSK Mon-Fri
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run brief
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          DEEPSEEK_API_KEY:   ${{ secrets.DEEPSEEK_API_KEY }}
        run: python daily_brief.py
