name: Anton Daily brief

on:
  schedule:
    # Время Ташкента, UTC+5 (переведено с MSK 05.08.2026).
    # Узбекистан летнее время не применяет — сдвиг фиксированный
    # круглый год, сезонной правки cron не потребуется.
    - cron: '30 3 * * 1-5'   # 08:30 Ташкент  # 08:00 MSK Mon-Fri
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run brief
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          DEEPSEEK_API_KEY:   ${{ secrets.DEEPSEEK_API_KEY }}
        run: python daily_brief.py
      - name: Commit usage state
        # 20.08.2026: daily_brief.py теперь пишет usage_tracker'ом в
        # state_usage.json (учёт трат DeepSeek) — раньше этот воркфлоу
        # был чисто read-only, без commit-шага вообще, значит эти данные
        # физически писались на диск раннера и терялись при каждом
        # прогоне. Только один файл в git add — тот класс git-бага, что
        # нашли в digest.yml (несуществующий файл валит всю команду), здесь
        # неприменим при единственном аргументе.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state_usage.json || true
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "daily_brief usage state: $(date -u +%Y-%m-%d_%H-%MZ)"
          for i in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git rebase origin/main || git rebase --abort
            git push origin HEAD:main && exit 0
            echo "retry $i"; sleep $((RANDOM % 10 + 5))
          done
          echo "push failed after 8 retries"; exit 1
