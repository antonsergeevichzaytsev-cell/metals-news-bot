name: Alert on failure

# Мета-слой: слушает завершение ЛЮБОГО другого воркфлоу в репо и, если
# conclusion == failure, шлёт один короткий пинг в Telegram. Раньше
# единственный способ узнать о падении бота — самому зайти в Actions
# (так и было 27.07: pipeline_sync лежал 30+ часов, никто не знал).
#
# Не трогает код существующих ботов — подключается снаружи через
# workflow_run. static_check.yml сюда НЕ входит намеренно: его failure
# уже виден в PR/commit статусе на GitHub, дублировать шумно.

on:
  workflow_run:
    workflows:
      - "Account watch"
      - "Anton Daily brief"
      - "Metals & Mining digest"
      - "Evening digest"
      - "Filings watcher"
      - "Inbox consolidator"
      - "LinkedIn ideas"
      - "Mission Control"
      - "Pipeline sync"
      - "Weekly Check"
    types:
      - completed

jobs:
  notify:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Вся логика — в alert_triage.py: он отсеивает инфраструктурные
      # отмены GitHub (job cancelled, шагов ноль — код не выполнялся)
      # и шлёт пинг только на реальные падения. Правится без токена
      # со scope workflow, в отличие от этого файла.
      - name: Triage and notify
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          WF_URL: ${{ github.event.workflow_run.html_url }}
          WF_SHA: ${{ github.event.workflow_run.head_sha }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python alert_triage.py
