name: Mission Control

on:
  schedule:
    # Mon-Fri 07:45 MSK = 04:45 UTC
    # Время Ташкента, UTC+5 (переведено с MSK 05.08.2026).
    # Узбекистан летнее время не применяет — сдвиг фиксированный
    # круглый год, сезонной правки cron не потребуется.
    - cron: '45 2 * * 1-5'   # 07:45 Ташкент
  workflow_dispatch:

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Mission Control
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python mission_control.py
      - name: Commit usage state
        # 20.08.2026: см. daily_brief.yml — тот же случай, mission_control.py
        # теперь тоже пишет usage_tracker'ом, воркфлоу был read-only.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state_usage.json || true
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "mission_control usage state: $(date -u +%Y-%m-%d_%H-%MZ)"
          for i in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git rebase origin/main || git rebase --abort
            git push origin HEAD:main && exit 0
            echo "retry $i"; sleep $((RANDOM % 10 + 5))
          done
          echo "push failed after 8 retries"; exit 1
